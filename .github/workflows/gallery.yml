name Generate Gallery JSON

on
  push
    branches [ main, master ]

jobs
  generate
    runs-on ubuntu-latest
    permissions
      contents write
    steps
      - uses actionscheckout@v4

      - name Generate gallery.json
        run 
          python3 -c 
          import os, json
          exts = ('.png', '.jpg', '.jpeg', '.gif', '.webp')
          gallery = {}
          for root, dirs, files in os.walk('.')
              imgs = [f for f in files if f.lower().endswith(exts)]
              if imgs
                  path = os.path.relpath(root, '.').replace('', '')
                  if path != '.'
                      gallery[path] = sorted(imgs)
          with open('gallery.json', 'w', encoding='utf-8') as f
              json.dump(gallery, f, indent=2)
          

      - name Commit and push gallery.json
        run 
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add gallery.json
          git diff --staged --quiet  (git commit -m Auto-update gallery.json && git push)