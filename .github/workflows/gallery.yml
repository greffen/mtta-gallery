name: Generate Gallery Index

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          python3 -c "
          import os, json
          exts = ('.png', '.jpg', '.jpeg', '.gif', '.webp')
          files = []
          for root, dirs, filenames in os.walk('.'):
              if '.git' in root or '.github' in root:
                  continue
              for f in filenames:
                  if f.lower().endswith(exts):
                      rel = os.path.relpath(os.path.join(root, f), '.').replace('\\\\', '/')
                      files.append(rel)
          files.sort()
          with open('images.json', 'w', encoding='utf-8') as f:
              json.dump(files, f, indent=2)
          "

      - name: Commit and Push Updated images.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update images.json gallery manifest" && git push)
